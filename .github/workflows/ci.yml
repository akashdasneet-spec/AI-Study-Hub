name: Continuous Integration & Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build, Lint, Typecheck & Vitest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client Artifacts
        run: pnpm run --filter @hub/database prisma:generate || true

      - name: Monorepo Static Typecheck
        run: pnpm run typecheck

      - name: Execute Vitest Unit & Integration Tests
        run: pnpm test

      - name: Monorepo Build Check
        run: pnpm run build || true
