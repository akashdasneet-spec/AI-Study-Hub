global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-service'
    static_configs:
      - targets: ['api:4000']

  - job_name: 'websocket-service'
    static_configs:
      - targets: ['websocket:4001']

  - job_name: 'ai-service'
    static_configs:
      - targets: ['ai-service:4002']
