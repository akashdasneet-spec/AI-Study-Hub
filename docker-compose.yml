version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studyhub_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aistudyhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studyhub_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyhub_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/aistudyhub?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_MODEL: gpt-4o
      GEMINI_MODEL: gemini-1.5-pro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyhub_websocket
    restart: always
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyhub_ai
    restart: always
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_MODEL: gpt-4o
      GEMINI_MODEL: gemini-1.5-pro
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
